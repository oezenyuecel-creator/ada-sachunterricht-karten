<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sachunterricht: Karten lesen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4eedb;
    --paper2:#ece2c4;
    --line:#cdbf94;
    --ink:#2b2620;
    --muted:#6b6152;
    --forest:#2f5d43;
    --forest-dk:#1f3e2d;
    --gold:#c9962c;
    --water:#3f7ca6;
    --brick:#b5502e;
    --wald:#bcd8ad;
    --wiese:#dfeccf;
    --wasser:#bcd9ea;
    --weinberg:#e8d3ab;
    --stadt:#f2d9cf;
    --ok:#2f5d43;
    --ok-bg:#dff0e0;
    --bad:#b5502e;
    --bad-bg:#f7e0d6;
    --shadow: 0 2px 0 rgba(43,38,32,.08), 0 8px 18px rgba(43,38,32,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.5), transparent 40%),
      repeating-linear-gradient(0deg, rgba(180,163,116,.10) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(180,163,116,.10) 0 1px, transparent 1px 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Lexend', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 60px;}
  header.top{text-align:center; margin-bottom:14px;}
  header.top .compass{font-size:34px; display:block;}
  header.top h1{font-family:'Caveat', cursive; font-size:2.4rem; margin:2px 0 0; color:var(--forest-dk);}
  header.top p{margin:2px 0 0; color:var(--muted); font-size:.92rem;}
  .banner{
    background:var(--brick); color:#fff8ee; border-radius:14px; padding:10px 14px;
    font-size:.92rem; text-align:center; margin:12px 0 18px; box-shadow:var(--shadow);
  }
  .banner b{font-weight:800;}
  .card{
    background:#fffdf6; border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .menu-grid{grid-template-columns:1fr;} }
  .mod-card{
    background:#fffdf6; border:1px solid var(--line); border-radius:16px; padding:14px;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .08s ease;
    display:flex; flex-direction:column; gap:6px;
  }
  .mod-card:active{transform:scale(.98);}
  .mod-card .icon{font-size:26px;}
  .mod-card .title{font-weight:700; font-size:1rem;}
  .mod-card .desc{font-size:.8rem; color:var(--muted); min-height:32px;}
  .progress{height:8px; border-radius:5px; background:var(--paper2); overflow:hidden;}
  .progress > div{height:100%; background:var(--forest); border-radius:5px;}
  .progress-label{font-size:.72rem; color:var(--muted); font-family:'Space Mono', monospace;}
  .exam-card{
    background:linear-gradient(135deg, var(--forest-dk), var(--forest)); color:#fef8e8;
    border-radius:16px; padding:16px; margin-bottom:16px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px;
  }
  .exam-card .icon{font-size:34px;}
  .exam-card .title{font-weight:800; font-size:1.15rem;}
  .exam-card .desc{font-size:.82rem; opacity:.9;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:'Lexend'; font-weight:700; font-size:.88rem; border:none; border-radius:10px;
    padding:9px 14px; cursor:pointer; background:var(--forest); color:#fef8e8; box-shadow:var(--shadow);
  }
  .btn.secondary{background:#fff; color:var(--forest-dk); border:1.5px solid var(--forest);}
  .btn.gold{background:var(--gold); color:#3a2a08;}
  .btn:active{transform:translateY(1px);}
  .pill{
    font-family:'Space Mono', monospace; font-size:.75rem; padding:3px 9px; border-radius:20px;
    background:var(--paper2); color:var(--muted);
  }
  h2.mod-title{font-size:1.3rem; margin:2px 0 10px; color:var(--forest-dk);}
  .tabbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .tabbar button{
    font-family:'Lexend'; font-weight:700; font-size:.82rem; border:1.5px solid var(--line);
    background:#fff; color:var(--muted); border-radius:20px; padding:6px 12px; cursor:pointer;
  }
  .tabbar button.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .catchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .catchip{
    font-size:.75rem; font-weight:700; padding:5px 10px; border-radius:20px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--muted);
  }
  .catchip.active{color:#fff;}
  .catchip[data-cat="wege"].active{background:#8a6a3f; border-color:#8a6a3f;}
  .catchip[data-cat="gebaeude"].active{background:var(--brick); border-color:var(--brick);}
  .catchip[data-cat="gewaesser"].active{background:var(--water); border-color:var(--water);}
  .catchip[data-cat="landschaft"].active{background:var(--forest); border-color:var(--forest);}
  .catchip[data-cat="sonstige"].active{background:var(--gold); border-color:var(--gold); color:#3a2a08;}
  .catchip.all.active{background:var(--ink); border-color:var(--ink);}

  .sheet-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px;}
  .sheet-item{
    background:#fffdf6; border:1.5px solid var(--line); border-radius:12px; padding:8px 6px;
    text-align:center; font-size:.72rem; color:var(--ink);
  }
  .sheet-item svg{width:44px; height:44px;}
  .sheet-item .lbl{margin-top:4px; font-weight:600;}

  .flash-icon{
    width:150px; height:150px; margin:6px auto 14px; background:#fffdf6; border:2px solid var(--line);
    border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .flash-icon svg{width:100px; height:100px;}
  .qprompt{font-size:1.05rem; font-weight:600; text-align:center; margin:6px 0 16px; line-height:1.4;}
  .qprompt b{color:var(--forest-dk);}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:420px){ .options{grid-template-columns:1fr;} }
  .opt{
    background:#fff; border:2px solid var(--line); border-radius:12px; padding:12px 10px;
    text-align:center; font-weight:600; font-size:.92rem; cursor:pointer; min-height:44px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .opt svg{width:34px; height:34px;}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .opt.disabled{pointer-events:none; opacity:.55;}
  .feedback{text-align:center; font-weight:700; margin-top:14px; min-height:24px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}
  .explain{
    text-align:center; font-size:.85rem; color:var(--muted); margin-top:6px; min-height:18px;
  }
  .nextbar{display:flex; justify-content:center; margin-top:16px;}
  .qmeta{display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:.78rem; color:var(--muted); margin-bottom:6px;}

  .compass-wrap{display:flex; justify-content:center; margin:6px 0 18px;}
  .compass{width:190px; height:190px;}

  .mapwrap{display:flex; flex-direction:column; align-items:center; margin:10px auto 16px; width:max-content; max-width:100%;}
  .colheaders{display:flex; margin-left:26px;}
  .colheaders div{width:36px; text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.78rem; color:var(--forest-dk);}
  .maprow{display:flex;}
  .rowheaders{display:flex; flex-direction:column;}
  .rowheaders div{height:36px; width:26px; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.78rem; color:var(--forest-dk);}
  .mapgrid{
    display:grid; grid-template-columns:repeat(9, 36px); grid-template-rows:repeat(9, 36px);
    border:2px solid var(--forest-dk); border-radius:6px; overflow:hidden; position:relative;
  }
  .cell{border:.5px solid rgba(43,38,32,.18);}
  .t-wald{background:var(--wald);} .t-wiese{background:var(--wiese);}
  .t-wasser{background:var(--wasser);} .t-weinberg{background:var(--weinberg);}
  .t-stadt{background:var(--stadt);}
  .poi{
    position:absolute; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    transform:translate(0,0);
  }
  .poi svg{width:24px; height:24px;}
  .poi-label{
    position:absolute; font-size:8px; font-weight:700; color:var(--ink); white-space:nowrap;
    top:100%; left:50%; transform:translateX(-50%); background:rgba(255,253,246,.9); padding:0 2px; border-radius:3px;
  }
  .hl{
    position:absolute; width:36px; height:36px; border:3px solid var(--brick); border-radius:6px;
    box-shadow:0 0 0 3px rgba(181,80,46,.25); animation:pulse 1.1s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .legend-mini{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; font-size:.72rem; color:var(--muted);}
  .legend-mini span{display:inline-flex; align-items:center; gap:4px;}
  .legend-mini i{width:12px; height:12px; border-radius:3px; display:inline-block;}

  .letterbtns, .numbtns{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
  .pickbtn{
    font-family:'Space Mono', monospace; font-weight:700; width:34px; height:34px; border-radius:8px;
    border:2px solid var(--line); background:#fff; cursor:pointer; font-size:.85rem;
  }
  .pickbtn.sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .picklabel{text-align:center; font-size:.78rem; color:var(--muted); margin:4px 0 2px;}
  .coordpreview{
    text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1.1rem;
    margin:8px 0 14px; color:var(--forest-dk);
  }

  .infobox{background:var(--paper2); border-left:4px solid var(--gold); border-radius:8px; padding:10px 12px; font-size:.86rem; margin-bottom:12px; line-height:1.5;}
  .infobox b{color:var(--forest-dk);}
  .taglist{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .tag{background:var(--paper2); border-radius:20px; padding:5px 12px; font-size:.78rem; font-weight:600; color:var(--forest-dk);}

  .result-big{text-align:center; margin:10px 0 6px;}
  .result-big .num{font-family:'Caveat', cursive; font-size:3.4rem; color:var(--forest-dk); line-height:1;}
  .result-big .sub{color:var(--muted); font-size:.9rem;}
  .breakdown{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
  .bdrow{display:flex; align-items:center; gap:8px; font-size:.85rem;}
  .bdrow .lbl{width:150px; flex-shrink:0;}
  .bdrow .progress{flex:1;}
  .bdrow .val{width:44px; text-align:right; font-family:'Space Mono',monospace; font-size:.78rem;}

  footer.foot{text-align:center; margin-top:20px;}
  footer.foot button{background:none; border:none; color:var(--muted); font-size:.75rem; text-decoration:underline; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */

const CAT_LABEL = {wege:'Wege & Verkehr', gebaeude:'Gebäude', gewaesser:'Gewässer', landschaft:'Landschaft', sonstige:'Sonstiges'};

  {id:'parkplatz', name:'Parkplatz', cat:'sonstige', svg: `<svg viewBox="0 0 100 100"><rect x="24" y="24" width="52" height="52" rx="6" fill="currentColor"/><text x="50" y="66" font-size="42" font-family="Lexend" font-weight="800" text-anchor="middle" fill="var(--paper-cut,#f4eedb)">P</text></svg>`},

const STORE_KEY = 'ada_sach_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultStore(); }
  catch(e){ return defaultStore(); }
}
function defaultStore(){
  return {scores:{himmel:{c:0,t:0}, zeichen:{c:0,t:0}, grid:{c:0,t:0}, bildarten:{c:0,t:0}, arten:{c:0,t:0}, massstab:{c:0,t:0}}};
}
let STORE = loadStore();
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }
function recordAnswer(cat, correct){
  STORE.scores[cat].t++;
  if(correct) STORE.scores[cat].c++;
  saveStore();
}
function pct(cat){
  const s = STORE.scores[cat];
  if(!s || s.t===0) return 0;
  return Math.round(100*s.c/s.t);
}

function compassSVG(highlight){
  const marks = DIRS.map(d=>{
    const on = highlight===d.id;
    const pos = {N:[100,20],O:[180,100],S:[100,180],W:[20,100]}[d.id];
    return `<text x="${pos[0]}" y="${pos[1]}" text-anchor="middle" dominant-baseline="middle"
      font-family="Lexend" font-weight="800" font-size="22"
      fill="${on?'#b5502e':'#2b2620'}">${d.id}</text>`;
  }).join('');
  const arrow = highlight ? (()=>{
    const rot = {N:0,O:90,S:180,W:270}[highlight];
    return `<g transform="rotate(${rot} 100 100)"><path d="M100 100 L100 40" stroke="#b5502e" stroke-width="6" stroke-linecap="round"/><path d="M100 40 L90 56 L110 56 Z" fill="#b5502e"/></g>`;
  })() : '';
  return `<svg class="compass" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="88" fill="#fffdf6" stroke="#2f5d43" stroke-width="4"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#cdbf94" stroke-width="2"/>
    <line x1="100" y1="12" x2="100" y2="188" stroke="#cdbf94" stroke-width="2"/>
    <line x1="12" y1="100" x2="188" y2="100" stroke="#cdbf94" stroke-width="2"/>
    ${arrow}
    ${marks}
    <circle cx="100" cy="100" r="5" fill="#2b2620"/>
  </svg>`;
}

  const list = zeichenCatFilter==='all' ? SIGNS : SIGNS.filter(s=>s.cat===zeichenCatFilter);

function zeichenQuiz(){
  const pool = zeichenCatFilter==='all' ? SIGNS : SIGNS.filter(s=>s.cat===zeichenCatFilter);
  const chosen = sample(pool, Math.min(10, pool.length));
  const qs = chosen.map(s=>({sign:s, dir: Math.random()<0.5 ? 'icon2name' : 'name2icon'}));
  runQuiz('zeichen', qs, renderZeichenQ, '🗺️ Kartenzeichen – Übung');
}
function renderZeichenQ(q, onAnswer){
  const pool = SIGNS.filter(s=>s.cat===q.sign.cat && s.id!==q.sign.id);
  const distractors = sample(pool, Math.min(3, pool.length));
  let extra = SIGNS.filter(s=>s.id!==q.sign.id && !distractors.includes(s));
  while(distractors.length<3 && extra.length){ distractors.push(extra.pop()); }
  const opts = shuffle([q.sign, ...distractors]);
  if(q.dir==='icon2name'){
    return `
      <div class="flash-icon">${q.sign.svg}</div>
      <div class="qprompt">Wie heißt dieses Kartenzeichen?</div>
      <div class="options">
        ${opts.map(s=>`<div class="opt" data-id="${s.id}" onclick="handleOpt(this,'${s.id}')">${s.name}</div>`).join('')}
      </div>`;
  } else {
    return `
      <div class="qprompt">Welches Zeichen bedeutet <b>${q.sign.name}</b>?</div>
      <div class="options">
        ${opts.map(s=>`<div class="opt" data-id="${s.id}" onclick="handleOpt(this,'${s.id}')">${s.svg}</div>`).join('')}
      </div>`;
  }
}

/* ============ PLANQUADRATE / GRID ============ */
function mapGridHTML(opts={}){
  const {showLabels=true, highlightCoord=null} = opts;
  let cells = '';
  for(const r of ROWS){
    for(const c of COLS){
      const t = TERRAIN[c+r] || 'wiese';
      cells += `<div class="cell t-${t}" style="grid-column:${COLS.indexOf(c)+1}; grid-row:${r};"></div>`;
    }
  }
  let pois = POIS.map(p=>{
    const ci = COLS.indexOf(p.col)+1, ri = p.row;
    const sign = SIGN_BY_ID[p.icon];
    return `<div class="poi" style="grid-column:${ci}; grid-row:${ri};">${sign.svg}${showLabels?`<div class="poi-label">${p.name}</div>`:''}</div>`;
  }).join('');
  let hl = '';
  if(highlightCoord){
    const ci = COLS.indexOf(highlightCoord.col)+1, ri = highlightCoord.row;
    hl = `<div class="hl" style="grid-column:${ci}; grid-row:${ri};"></div>`;
  }
  return `
  <div class="mapwrap">
    <div class="colheaders"><div style="width:26px;"></div>${COLS.map(c=>`<div>${c}</div>`).join('')}</div>
    <div class="maprow">
      <div class="rowheaders">${ROWS.map(r=>`<div>${r}</div>`).join('')}</div>
      <div class="mapgrid" style="display:grid; grid-template-columns:repeat(9,36px); grid-template-rows:repeat(9,36px); position:relative;">
        ${cells}${pois}${hl}
      </div>
    </div>
  </div>
  <div class="legend-mini">
    <span><i style="background:var(--wald)"></i>Wald</span>
    <span><i style="background:var(--wiese)"></i>Wiese</span>
    <span><i style="background:var(--wasser)"></i>Wasser</span>
    <span><i style="background:var(--weinberg)"></i>Weinberg</span>
    <span><i style="background:var(--stadt)"></i>Bebaut</span>
  </div>`;
}

        <b>Zahlen</b> (1–9) die <b>waagerechten Zeilen</b>. Eine Koordinate schreibt man z.B. so: <b>D,4</b>.

function gridQuiz(mode){
  // mode 'find': given name, pick coordinate. 'whatis': given coordinate, pick name.
  const items = sample(QUERYABLE, Math.min(8, QUERYABLE.length));
  const qs = items.map(it=>({item:it, mode}));
  runQuiz('grid', qs, renderGridQ, mode==='find' ? '📐 Planquadrat finden' : '📐 Was ist dort?');
}
let gridPickState = {col:null, row:null};
function renderGridQ(q, onAnswer){
  if(q.mode==='whatis'){
    const pool = QUERYABLE.filter(x=>x.name!==q.item.name);
    const distractors = sample(pool,3);
    const opts = shuffle([q.item, ...distractors]);
    return `
      ${mapGridHTML({showLabels:false, highlightCoord:{col:q.item.col,row:q.item.row}})}
      <div class="qprompt">Was findest du im Planquadrat <b>${q.item.col},${q.item.row}</b>?</div>
      <div class="options">
        ${opts.map(o=>`<div class="opt" data-id="${o.name}" onclick="handleOpt(this,'${o.name}')">${o.name}</div>`).join('')}
      </div>
    `;
  } else {
    gridPickState = {col:null, row:null};
    return `
      ${mapGridHTML({showLabels:false})}
      <div class="qprompt">In welchem Planquadrat liegt <b>${q.item.name}</b>?</div>
      <div class="picklabel">Buchstabe (Spalte)</div>
      <div class="letterbtns">${COLS.map(c=>`<button class="pickbtn" data-col="${c}" onclick="pickCol('${c}')">${c}</button>`).join('')}</div>
      <div class="picklabel">Zahl (Zeile)</div>
      <div class="numbtns">${ROWS.map(r=>`<button class="pickbtn" data-row="${r}" onclick="pickRow(${r})">${r}</button>`).join('')}</div>
      <div class="coordpreview" id="coordpreview">? , ?</div>
      <div style="text-align:center;"><button class="btn" id="submitCoord" style="opacity:.5; pointer-events:none;" onclick="submitCoord()">Antworten</button></div>
    `;
  }
}
function pickCol(c){
  gridPickState.col = c;
  document.querySelectorAll('[data-col]').forEach(b=>b.classList.toggle('sel', b.dataset.col===c));
  updateCoordPreview();
}
function pickRow(r){
  gridPickState.row = r;
  document.querySelectorAll('[data-row]').forEach(b=>b.classList.toggle('sel', Number(b.dataset.row)===r));
  updateCoordPreview();
}
function updateCoordPreview(){
  document.getElementById('coordpreview').textContent = `${gridPickState.col||'?'} , ${gridPickState.row||'?'}`;
  const btn = document.getElementById('submitCoord');
  if(gridPickState.col && gridPickState.row){ btn.style.opacity=1; btn.style.pointerEvents='auto'; }
}
function submitCoord(){
  const q = CURRENT_QUIZ.qs[CURRENT_QUIZ.idx];
  const correct = gridPickState.col===q.item.col && gridPickState.row===q.item.row;
  document.querySelectorAll('.pickbtn').forEach(b=>b.classList.add('disabled'));
  document.getElementById('submitCoord').style.pointerEvents='none';
  finishAnswer(correct, `Richtig: ${q.item.col},${q.item.row}`);
}

/* ============ GENERIC QUIZ ENGINE (mc-based modules) ============ */
function quizHome(cat){
  const titles = {bildarten:'📷 Schrägbild & Karte', arten:'🌍 Kartenarten', massstab:'📏 Maßstab & Legende'};
  const bank = {bildarten:BILDARTEN_Q, arten:KARTENARTEN_Q, massstab:MASSSTAB_Q}[cat];
  render(`
    ${topbar(titles[cat])}
    <div class="card">
      ${cat==='bildarten' ? `<div class="infobox">
        <b>Schrägbild:</b> schräg von der Seite fotografiert, manches ist verdeckt.<br>
        <b>Senkrechtbild (Draufsicht):</b> senkrecht von oben, nichts verdeckt.<br>
        <b>Karte:</b> verkleinert &amp; mit Zeichen (Legende) dargestellt.
      </div>` : ''}
      ${cat==='arten' ? `<div class="infobox">
        <b>Stadtplan</b> = Straßen &amp; Gebäude in der Stadt · <b>Straßenkarte</b> = für Autofahrer ·
        <b>Seekarte</b> = für Kapitäne · <b>Topografische Karte</b> = Landschaft genau, für Wanderer.
      </div>` : ''}
      ${cat==='massstab' ? `<div class="infobox">
        Der <b>Maßstab</b> zeigt, um wie viel die Landschaft verkleinert dargestellt ist,
        z.B. <b>1:5000</b> bedeutet 1 cm auf der Karte = 50 m in Wirklichkeit.
      </div>` : ''}
      <div style="text-align:center;"><button class="btn" onclick="genericQuiz('${cat}')">Jetzt üben →</button></div>
    </div>
  `);
}
function genericQuiz(cat){
  const bank = {bildarten:BILDARTEN_Q, arten:KARTENARTEN_Q, massstab:MASSSTAB_Q}[cat];
  const titles = {bildarten:'📷 Schrägbild & Karte – Übung', arten:'🌍 Kartenarten – Übung', massstab:'📏 Maßstab – Übung'};
  const qs = sample(bank, Math.min(8, bank.length));
  runQuiz(cat, qs, renderGenericQ, titles[cat]);
}
function renderGenericQ(q, onAnswer){
  const opts = q.opts.map((o,i)=>({text:o, correct:i===q.a}));
  const shuffled = shuffle(opts);
  return `
    <div class="qprompt">${q.q}</div>
    <div class="options">
      ${shuffled.map((o,i)=>`<div class="opt" data-correct="${o.correct}" onclick="handleGenericOpt(this)">${o.text}</div>`).join('')}
    </div>
  `;
}
function handleGenericOpt(elm){
  const correct = elm.dataset.correct==='true';
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    if(o.dataset.correct==='true') o.classList.add('correct');
  });
  if(!correct) elm.classList.add('wrong');
  const q = CURRENT_QUIZ.qs[CURRENT_QUIZ.idx];
  finishAnswer(correct, q.ex || '');
}

/* ============ SHARED QUIZ RUNNER ============ */
let CURRENT_QUIZ = null;
function runQuiz(cat, qs, renderFn, title){
  CURRENT_QUIZ = {cat, qs, idx:0, score:0, renderFn, title, isExam:false};
  showQuizQuestion();
}
function showQuizQuestion(){
  const cq = CURRENT_QUIZ;
  const q = cq.qs[cq.idx];
  const backTarget = cq.isExam ? null : cq.cat;
  render(`
    <div class="topbar">
      <button class="btn secondary" onclick="${cq.isExam ? 'screenMenu()' : `openModule('${backEquivalent(cq.cat)}')`}">← Menü</button>
      <h2 class="mod-title" style="margin:0;">${cq.title}</h2>
      <span class="pill">${cq.idx+1} / ${cq.qs.length}</span>
    </div>
    <div class="card">
      <div id="quizbody">${cq.renderFn(q, null)}</div>
      <div class="feedback" id="feedback"></div>
      <div class="explain" id="explainbox"></div>
      <div class="nextbar" id="nextbar"></div>
    </div>
  `);
}
function backEquivalent(cat){
  return cat; // module ids match openModule ids for himmel/zeichen/grid; generic ones route via quizHome
}
function handleOpt(elm, id){
  const q = CURRENT_QUIZ.qs[CURRENT_QUIZ.idx];
  let correct;
  if(q.type==='compass' || q.type==='pos') correct = id===q.target;
  else if(q.sign) correct = id===q.sign.id;
  else correct = id===q.item.name;

  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    const oid = o.dataset.id;
    let isCorrect;
    if(q.type==='compass'||q.type==='pos') isCorrect = oid===q.target;
    else if(q.sign) isCorrect = oid===q.sign.id;
    else isCorrect = oid===q.item.name;
    if(isCorrect) o.classList.add('correct');
  });
  if(!correct) elm.classList.add('wrong');
  finishAnswer(correct, '');
}
function finishAnswer(correct, explainMsg){
  const cq = CURRENT_QUIZ;
  if(correct) cq.score++;
  recordAnswer(cq.cat, correct);
  document.getElementById('feedback').textContent = correct ? '✓ Richtig!' : '✗ Leider falsch.';
  document.getElementById('feedback').className = 'feedback ' + (correct?'ok':'bad');
  document.getElementById('explainbox').textContent = explainMsg || '';
  const isLast = cq.idx === cq.qs.length-1;
  document.getElementById('nextbar').innerHTML = `<button class="btn" onclick="${isLast?'finishQuiz()':'nextQuizQ()'}">${isLast?'Auswertung →':'Weiter →'}</button>`;
}
function nextQuizQ(){
  CURRENT_QUIZ.idx++;
  showQuizQuestion();
}
function finishQuiz(){
  const cq = CURRENT_QUIZ;
  if(cq.isExam) return finishExam();
  const p = Math.round(100*cq.score/cq.qs.length);
  render(`
    ${topbar('Ergebnis')}
    <div class="card">
      <div class="result-big">
        <div class="num">${cq.score} / ${cq.qs.length}</div>
        <div class="sub">${p}% richtig</div>
      </div>
      <div style="text-align:center; margin:16px 0; font-size:1.5rem;">${p>=80?'🌟 Super gemacht!':p>=50?'👍 Gut, weiter so!':'💪 Nochmal üben lohnt sich!'}</div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn secondary" onclick="openModule('${cq.cat}')">Zurück zum Thema</button>
        <button class="btn" onclick="screenMenu()">Zum Menü</button>
      </div>
    </div>
  `);
}

/* ============ PRÜFUNGSSIMULATION ============ */
function buildExamQuestions(){
  const qs = [];
  // Kartenzeichen: 6
  sample(SIGNS,6).forEach(s=>qs.push({cat:'zeichen', render:renderZeichenQ, q:{sign:s, dir: Math.random()<0.5?'icon2name':'name2icon'}}));
  // Planquadrate: 5
  sample(QUERYABLE,5).forEach(it=>qs.push({cat:'grid', render:renderGridQ, q:{item:it, mode: Math.random()<0.5?'find':'whatis'}}));
  // Himmelsrichtungen: 3
  sample(DIRS,3).forEach(d=>qs.push({cat:'himmel', render:renderHimmelQ, q:{type: Math.random()<0.5?'compass':'pos', target:d.id, prompt:`Auf der Karte ist ${d.pos} welche Himmelsrichtung?`}}));
  // Bildarten: 2
  sample(BILDARTEN_Q,2).forEach(q=>qs.push({cat:'bildarten', render:renderGenericQ, q}));
  // Kartenarten: 2
  sample(KARTENARTEN_Q,2).forEach(q=>qs.push({cat:'arten', render:renderGenericQ, q}));
  // Maßstab: 2
  sample(MASSSTAB_Q,2).forEach(q=>qs.push({cat:'massstab', render:renderGenericQ, q}));
  return shuffle(qs);
}
function startExam(){
  const raw = buildExamQuestions();
  CURRENT_QUIZ = {
    cat:'exam', isExam:true, idx:0, score:0, title:'🎯 Prüfungssimulation',
    qs: raw.map(r=>r.q),
    renderFn: null,
    perQ: raw, // holds cat + render fn per index
    breakdown: {himmel:{c:0,t:0}, zeichen:{c:0,t:0}, grid:{c:0,t:0}, bildarten:{c:0,t:0}, arten:{c:0,t:0}, massstab:{c:0,t:0}},
  };
  showExamQuestion();
}
function showExamQuestion(){
  const cq = CURRENT_QUIZ;
  const item = cq.perQ[cq.idx];
  render(`
    <div class="topbar">
      <button class="btn secondary" onclick="screenMenu()">← Abbrechen</button>
      <h2 class="mod-title" style="margin:0;">${cq.title}</h2>
      <span class="pill">${cq.idx+1} / ${cq.qs.length}</span>
    </div>
    <div class="card">
      <div id="quizbody">${item.render(item.q, null)}</div>
      <div class="feedback" id="feedback"></div>
      <div class="explain" id="explainbox"></div>
      <div class="nextbar" id="nextbar"></div>
    </div>
  `);
}
// override handlers to work for exam too by checking CURRENT_QUIZ.isExam in finishAnswer path
const _origHandleGeneric = handleGenericOpt;
handleGenericOpt = function(elm){
  const correct = elm.dataset.correct==='true';
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    if(o.dataset.correct==='true') o.classList.add('correct');
  });
  if(!correct) elm.classList.add('wrong');
  const cq = CURRENT_QUIZ;
  const q = cq.isExam ? cq.perQ[cq.idx].q : cq.qs[cq.idx];
  examOrModuleFinish(correct, q.ex||'');
};
const _origHandleOpt = handleOpt;
handleOpt = function(elm, id){
  const cq = CURRENT_QUIZ;
  const q = cq.isExam ? cq.perQ[cq.idx].q : cq.qs[cq.idx];
  let correct;
  if(q.type==='compass' || q.type==='pos') correct = id===q.target;
  else if(q.sign) correct = id===q.sign.id;
  else correct = id===q.item.name;

  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('disabled');
    const oid = o.dataset.id;
    let isCorrect;
    if(q.type==='compass'||q.type==='pos') isCorrect = oid===q.target;
    else if(q.sign) isCorrect = oid===q.sign.id;
    else isCorrect = oid===q.item.name;
    if(isCorrect) o.classList.add('correct');
  });
  if(!correct) elm.classList.add('wrong');
  examOrModuleFinish(correct, '');
};
function submitCoord(){
  const cq = CURRENT_QUIZ;
  const q = cq.isExam ? cq.perQ[cq.idx].q : cq.qs[cq.idx];
  const correct = gridPickState.col===q.item.col && gridPickState.row===q.item.row;
  document.querySelectorAll('.pickbtn').forEach(b=>b.classList.add('disabled'));
  document.getElementById('submitCoord').style.pointerEvents='none';
  examOrModuleFinish(correct, `Richtig: ${q.item.col},${q.item.row}`);
}
function examOrModuleFinish(correct, explainMsg){
  const cq = CURRENT_QUIZ;
  if(cq.isExam){
    const cat = cq.perQ[cq.idx].cat;
    cq.breakdown[cat].t++;
    if(correct) cq.breakdown[cat].c++;
    if(correct) cq.score++;
    recordAnswer(cat, correct);
    document.getElementById('feedback').textContent = correct ? '✓ Richtig!' : '✗ Leider falsch.';
    document.getElementById('feedback').className = 'feedback ' + (correct?'ok':'bad');
    document.getElementById('explainbox').textContent = explainMsg || '';
    const isLast = cq.idx === cq.qs.length-1;
    document.getElementById('nextbar').innerHTML = `<button class="btn" onclick="${isLast?'finishExam()':'nextExamQ()'}">${isLast?'Auswertung →':'Weiter →'}</button>`;
  } else {
    finishAnswer(correct, explainMsg);
  }
}
function nextExamQ(){ CURRENT_QUIZ.idx++; showExamQuestion(); }
function finishExam(){
  const cq = CURRENT_QUIZ;
  const p = Math.round(100*cq.score/cq.qs.length);
  const catNames = {himmel:'Himmelsrichtungen', zeichen:'Kartenzeichen', grid:'Planquadrate', bildarten:'Schrägbild/Karte', arten:'Kartenarten', massstab:'Maßstab'};
  let weakest = null, weakestPct = 101;
  const rows = Object.entries(cq.breakdown).filter(([k,v])=>v.t>0).map(([k,v])=>{
    const pc = Math.round(100*v.c/v.t);
    if(pc<weakestPct){ weakestPct=pc; weakest=k; }
    return `<div class="bdrow"><div class="lbl">${catNames[k]}</div><div class="progress"><div style="width:${pc}%"></div></div><div class="val">${v.c}/${v.t}</div></div>`;
  }).join('');
  render(`
    ${topbar('Prüfungs-Ergebnis')}
    <div class="card">
      <div class="result-big">
        <div class="num">${cq.score} / ${cq.qs.length}</div>
        <div class="sub">${p}% richtig</div>
      </div>
      <div style="text-align:center; margin:14px 0; font-size:1.5rem;">${p>=85?'🌟 Klasse! Das sieht nach einer 1 aus!':p>=65?'👍 Solide! Übe noch die Schwachstellen.':'💪 Noch etwas üben, dann klappt´s!'}</div>
      <div class="breakdown">${rows}</div>
      ${weakest ? `<div style="text-align:center;"><button class="btn gold" onclick="openModule('${weakest}')">Schwäche gezielt üben: ${catNames[weakest]}</button></div>` : ''}
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px;">
        <button class="btn secondary" onclick="startExam()">Neue Prüfung</button>
        <button class="btn" onclick="screenMenu()">Zum Menü</button>
      </div>
    </div>
  `);
}

/* ============ INIT ============ */
screenMenu();
