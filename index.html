<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sachunterricht: Karten lesen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4eedb;
    --paper2:#ece2c4;
    --line:#cdbf94;
    --ink:#2b2620;
    --muted:#6b6152;
    --forest:#2f5d43;
    --forest-dk:#1f3e2d;
    --gold:#c9962c;
    --water:#3f7ca6;
    --brick:#b5502e;
    --wald:#bcd8ad;
    --wiese:#dfeccf;
    --wasser:#bcd9ea;
    --weinberg:#e8d3ab;
    --stadt:#f2d9cf;
    --ok:#2f5d43;
    --ok-bg:#dff0e0;
    --bad:#b5502e;
    --bad-bg:#f7e0d6;
    --shadow: 0 2px 0 rgba(43,38,32,.08), 0 8px 18px rgba(43,38,32,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.5), transparent 40%),
      repeating-linear-gradient(0deg, rgba(180,163,116,.10) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(180,163,116,.10) 0 1px, transparent 1px 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Lexend', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 60px;}
  header.top{text-align:center; margin-bottom:14px;}
  header.top .compass{font-size:34px; display:block;}
  header.top h1{font-family:'Caveat', cursive; font-size:2.4rem; margin:2px 0 0; color:var(--forest-dk);}
  header.top p{margin:2px 0 0; color:var(--muted); font-size:.92rem;}
  .banner{
    background:var(--brick); color:#fff8ee; border-radius:14px; padding:10px 14px;
    font-size:.92rem; text-align:center; margin:12px 0 18px; box-shadow:var(--shadow);
  }
  .banner b{font-weight:800;}
  .card{
    background:#fffdf6; border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .menu-grid{grid-template-columns:1fr;} }
  .mod-card{
    background:#fffdf6; border:1px solid var(--line); border-radius:16px; padding:14px;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .08s ease;
    display:flex; flex-direction:column; gap:6px;
  }
  .mod-card:active{transform:scale(.98);}
  .mod-card .icon{font-size:26px;}
  .mod-card .title{font-weight:700; font-size:1rem;}
  .mod-card .desc{font-size:.8rem; color:var(--muted); min-height:32px;}
  .progress{height:8px; border-radius:5px; background:var(--paper2); overflow:hidden;}
  .progress > div{height:100%; background:var(--forest); border-radius:5px;}
  .progress-label{font-size:.72rem; color:var(--muted); font-family:'Space Mono', monospace;}
  .exam-card{
    background:linear-gradient(135deg, var(--forest-dk), var(--forest)); color:#fef8e8;
    border-radius:16px; padding:16px; margin-bottom:16px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px;
  }
  .exam-card .icon{font-size:34px;}
  .exam-card .title{font-weight:800; font-size:1.15rem;}
  .exam-card .desc{font-size:.82rem; opacity:.9;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:'Lexend'; font-weight:700; font-size:.88rem; border:none; border-radius:10px;
    padding:9px 14px; cursor:pointer; background:var(--forest); color:#fef8e8; box-shadow:var(--shadow);
  }
  .btn.secondary{background:#fff; color:var(--forest-dk); border:1.5px solid var(--forest);}
  .btn.gold{background:var(--gold); color:#3a2a08;}
  .btn:active{transform:translateY(1px);}
  .pill{
    font-family:'Space Mono', monospace; font-size:.75rem; padding:3px 9px; border-radius:20px;
    background:var(--paper2); color:var(--muted);
  }
  h2.mod-title{font-size:1.3rem; margin:2px 0 10px; color:var(--forest-dk);}
  .tabbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .tabbar button{
    font-family:'Lexend'; font-weight:700; font-size:.82rem; border:1.5px solid var(--line);
    background:#fff; color:var(--muted); border-radius:20px; padding:6px 12px; cursor:pointer;
  }
  .tabbar button.active{background:var(--forest); border-color:var(--forest); color:#fff;}
  .catchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .catchip{
    font-size:.75rem; font-weight:700; padding:5px 10px; border-radius:20px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--muted);
  }
  .catchip.active{color:#fff;}
  .catchip[data-cat="wege"].active{background:#8a6a3f; border-color:#8a6a3f;}
  .catchip[data-cat="gebaeude"].active{background:var(--brick); border-color:var(--brick);}
  .catchip[data-cat="gewaesser"].active{background:var(--water); border-color:var(--water);}
  .catchip[data-cat="landschaft"].active{background:var(--forest); border-color:var(--forest);}
  .catchip[data-cat="sonstige"].active{background:var(--gold); border-color:var(--gold); color:#3a2a08;}
  .catchip.all.active{background:var(--ink); border-color:var(--ink);}

  .sheet-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px;}
  .sheet-item{
    background:#fffdf6; border:1.5px solid var(--line); border-radius:12px; padding:8px 6px;
    text-align:center; font-size:.72rem; color:var(--ink);
  }
  .sheet-item svg{width:44px; height:44px;}
  .sheet-item .lbl{margin-top:4px; font-weight:600;}

  .flash-icon{
    width:150px; height:150px; margin:6px auto 14px; background:#fffdf6; border:2px solid var(--line);
    border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .flash-icon svg{width:100px; height:100px;}
  .qprompt{font-size:1.05rem; font-weight:600; text-align:center; margin:6px 0 16px; line-height:1.4;}
  .qprompt b{color:var(--forest-dk);}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:420px){ .options{grid-template-columns:1fr;} }
  .opt{
    background:#fff; border:2px solid var(--line); border-radius:12px; padding:12px 10px;
    text-align:center; font-weight:600; font-size:.92rem; cursor:pointer; min-height:44px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .opt svg{width:34px; height:34px;}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .opt.disabled{pointer-events:none; opacity:.55;}
  .feedback{text-align:center; font-weight:700; margin-top:14px; min-height:24px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}
  .explain{
    text-align:center; font-size:.85rem; color:var(--muted); margin-top:6px; min-height:18px;
  }
  .nextbar{display:flex; justify-content:center; margin-top:16px;}
  .qmeta{display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:.78rem; color:var(--muted); margin-bottom:6px;}

  .compass-wrap{display:flex; justify-content:center; margin:6px 0 18px;}
  .compass{width:190px; height:190px;}

  .mapwrap{display:flex; flex-direction:column; align-items:center; margin:10px auto 16px; width:max-content; max-width:100%;}
  .colheaders{display:flex; margin-left:26px;}
  .colheaders div{width:36px; text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.78rem; color:var(--forest-dk);}
  .maprow{display:flex;}
  .rowheaders{display:flex; flex-direction:column;}
  .rowheaders div{height:36px; width:26px; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.78rem; color:var(--forest-dk);}
  .mapgrid{
    display:grid; grid-template-columns:repeat(9, 36px); grid-template-rows:repeat(9, 36px);
    border:2px solid var(--forest-dk); border-radius:6px; overflow:hidden; position:relative;
  }
  .cell{border:.5px solid rgba(43,38,32,.18);}
  .t-wald{background:var(--wald);} .t-wiese{background:var(--wiese);}
  .t-wasser{background:var(--wasser);} .t-weinberg{background:var(--weinberg);}
  .t-stadt{background:var(--stadt);}
  .poi{
    position:absolute; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    transform:translate(0,0);
  }
  .poi svg{width:24px; height:24px;}
  .poi-label{
    position:absolute; font-size:8px; font-weight:700; color:var(--ink); white-space:nowrap;
    top:100%; left:50%; transform:translateX(-50%); background:rgba(255,253,246,.9); padding:0 2px; border-radius:3px;
  }
  .hl{
    position:absolute; width:36px; height:36px; border:3px solid var(--brick); border-radius:6px;
    box-shadow:0 0 0 3px rgba(181,80,46,.25); animation:pulse 1.1s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .legend-mini{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; font-size:.72rem; color:var(--muted);}
  .legend-mini span{display:inline-flex; align-items:center; gap:4px;}
  .legend-mini i{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .cell.plain{background:#fdf8ea;}
  .lines-overlay{position:absolute; top:0; left:0; pointer-events:none; z-index:1;}
  .mini-compass{position:absolute; top:2px; right:2px; font-size:9px; font-weight:800; text-align:center; color:var(--forest-dk); background:rgba(255,253,246,.85); padding:1px 4px; border-radius:4px; line-height:1.15; z-index:5;}

  .mission-row{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; background:#fffdf6;}
  .mission-row:active{transform:scale(.99);}
  .mission-row .num{width:34px; height:34px; border-radius:50%; background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; font-size:.85rem;}
  .mission-row .mtitle{font-weight:700; font-size:.92rem;}
  .mission-row .msub{font-size:.76rem; color:var(--muted);}

  .wtable{width:100%; border-collapse:collapse; margin-bottom:14px; font-size:.86rem;}
  .wtable th, .wtable td{border:1px solid var(--line); padding:8px; text-align:left; vertical-align:top;}
  .wtable th{background:var(--paper2); font-weight:700;}

  .qcheck{border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:#fffdf6;}
  .qc-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:600; font-size:.9rem; line-height:1.3;}
  .qc-num{background:var(--forest); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:800; flex-shrink:0;}
  .qc-text{flex:1;}
  .qc-input{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:8px; font-family:'Lexend'; font-size:.88rem; resize:vertical; margin-bottom:8px;}
  .qc-actions{margin-bottom:8px;}
  .qc-answer{background:var(--paper2); border-radius:8px; padding:10px; margin-top:6px;}
  .qc-model{font-size:.85rem; margin-bottom:8px; line-height:1.45;}
  .qc-mark{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .marked-label{font-size:.76rem; color:var(--muted); font-weight:700;}
  .btn.small{padding:6px 10px; font-size:.78rem;}

  .doodle-grid{margin-bottom:6px;}
  .doodle-row{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:8px; flex-wrap:wrap;}
  .doodle-label{font-weight:700; width:84px; flex-shrink:0; font-size:.82rem;}
  .doodle-canvas{border:1.5px dashed var(--line); border-radius:8px; background:#fff; touch-action:none;}
  .doodle-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .doodle-ref{width:40px; height:40px; display:none; align-items:center; justify-content:center; background:var(--paper2); border-radius:8px;}
  .doodle-ref svg{width:32px; height:32px;}

  .tri-table{width:100%; border-collapse:collapse; margin:10px 0 14px;}
  .tri-table td, .tri-table th{padding:7px 6px; font-size:.8rem; border-bottom:1px solid var(--line);}
  .tri-table th{text-align:center; color:var(--muted);}
  .tri-btn{width:22px; height:22px; border-radius:5px; border:2px solid var(--line); cursor:pointer; background:#fff;}
  .tri-btn.sel-sicher{background:var(--ok); border-color:var(--ok);}
  .tri-btn.sel-fast{background:var(--gold); border-color:var(--gold);}
  .tri-btn.sel-ueben{background:var(--bad); border-color:var(--bad);}

  .letterbtns, .numbtns{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
  .pickbtn{
    font-family:'Space Mono', monospace; font-weight:700; width:34px; height:34px; border-radius:8px;
    border:2px solid var(--line); background:#fff; cursor:pointer; font-size:.85rem;
  }
  .pickbtn.sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .picklabel{text-align:center; font-size:.78rem; color:var(--muted); margin:4px 0 2px;}
  .coordpreview{
    text-align:center; font-family:'Space Mono',monospace; font-weight:700; font-size:1.1rem;
    margin:8px 0 14px; color:var(--forest-dk);
  }

  .infobox{background:var(--paper2); border-left:4px solid var(--gold); border-radius:8px; padding:10px 12px; font-size:.86rem; margin-bottom:12px; line-height:1.5;}
  .infobox b{color:var(--forest-dk);}
  .taglist{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .tag{background:var(--paper2); border-radius:20px; padding:5px 12px; font-size:.78rem; font-weight:600; color:var(--forest-dk);}

  .result-big{text-align:center; margin:10px 0 6px;}
  .result-big .num{font-family:'Caveat', cursive; font-size:3.4rem; color:var(--forest-dk); line-height:1;}
  .result-big .sub{color:var(--muted); font-size:.9rem;}
  .breakdown{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
  .bdrow{display:flex; align-items:center; gap:8px; font-size:.85rem;}
  .bdrow .lbl{width:150px; flex-shrink:0;}
  .bdrow .progress{flex:1;}
  .bdrow .val{width:44px; text-align:right; font-family:'Space Mono',monospace; font-size:.78rem;}

  footer.foot{text-align:center; margin-top:20px;}
  footer.foot button{background:none; border:none; color:var(--muted); font-size:.75rem; text-decoration:underline; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */

const CAT_LABEL = {wege:'Wege & Verkehr', gebaeude:'Gebäude', gewaesser:'Gewässer', landschaft:'Landschaft', sonstige:'Sonstiges'};

function ico(inner, extra=''){
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
}

const SIGNS = [
  {id:'strasse', name:'Straße', cat:'wege', svg: ico(`<line x1="10" y1="42" x2="90" y2="42"/><line x1="10" y1="58" x2="90" y2="58"/>`)},
  {id:'weg', name:'Weg', cat:'wege', svg: ico(`<line x1="10" y1="50" x2="90" y2="50"/>`)},
  {id:'pfad', name:'Pfad', cat:'wege', svg: ico(`<line x1="10" y1="50" x2="90" y2="50" stroke-dasharray="9 9"/>`)},
  {id:'autobahn', name:'Autobahn', cat:'wege', svg: ico(`<line x1="10" y1="32" x2="90" y2="32"/><line x1="10" y1="50" x2="90" y2="50"/><line x1="10" y1="68" x2="90" y2="68"/>`)},
  {id:'eisenbahn', name:'Eisenbahn', cat:'wege', svg: ico(`<line x1="8" y1="50" x2="92" y2="50" stroke-width="8"/><line x1="16" y1="42" x2="16" y2="58"/><line x1="30" y1="42" x2="30" y2="58"/><line x1="44" y1="42" x2="44" y2="58"/><line x1="58" y1="42" x2="58" y2="58"/><line x1="72" y1="42" x2="72" y2="58"/><line x1="86" y1="42" x2="86" y2="58"/>`)},
  {id:'bruecke', name:'Brücke', cat:'wege', svg: ico(`<line x1="8" y1="50" x2="33" y2="50"/><line x1="67" y1="50" x2="92" y2="50"/><path d="M33 38 L67 62 M33 62 L67 38"/>`)},
  {id:'haus', name:'Haus', cat:'gebaeude', svg: `<svg viewBox="0 0 100 100"><rect x="28" y="34" width="44" height="38" fill="currentColor"/></svg>`},
  {id:'oeffentlich', name:'Öffentliches Gebäude', cat:'gebaeude', svg: `<svg viewBox="0 0 100 100"><rect x="18" y="28" width="64" height="46" fill="currentColor"/></svg>`},
  {id:'wohngebaeude', name:'Wohngebäude', cat:'gebaeude', svg: ico(`<rect x="22" y="30" width="56" height="44" stroke-width="5"/><line x1="22" y1="38" x2="78" y2="38" stroke-width="3"/><line x1="22" y1="48" x2="78" y2="48" stroke-width="3"/><line x1="22" y1="58" x2="78" y2="58" stroke-width="3"/><line x1="22" y1="68" x2="78" y2="68" stroke-width="3"/>`)},
  {id:'kirche', name:'Kirche', cat:'gebaeude', svg: ico(`<circle cx="50" cy="62" r="16"/><line x1="50" y1="18" x2="50" y2="44"/><line x1="37" y1="28" x2="63" y2="28"/>`)},
  {id:'burg', name:'Burg', cat:'gebaeude', svg: ico(`<circle cx="38" cy="66" r="10" fill="currentColor"/><line x1="38" y1="56" x2="38" y2="18"/><path d="M38 18 L72 30 L38 42 Z" fill="currentColor"/>`)},
  {id:'ruine', name:'Ruine', cat:'gebaeude', svg: ico(`<circle cx="42" cy="64" r="10" fill="currentColor"/><path d="M42 54 L58 36 L52 46 L66 24"/>`)},
  {id:'kapelle', name:'Kapelle', cat:'gebaeude', svg: ico(`<line x1="50" y1="16" x2="50" y2="84"/><line x1="28" y1="38" x2="72" y2="38"/>`)},
  {id:'denkmal', name:'Denkmal', cat:'gebaeude', svg: ico(`<circle cx="50" cy="34" r="11" fill="currentColor"/><path d="M34 50 L66 50 L58 82 L42 82 Z"/>`)},
  {id:'forsthaus', name:'Forsthaus', cat:'gebaeude', svg: ico(`<circle cx="50" cy="66" r="10" fill="currentColor"/><path d="M50 56 Q32 38 20 44 M50 56 Q68 38 80 44"/>`)},
  {id:'leuchtturm', name:'Leuchtturm', cat:'gebaeude', svg: ico(`<path d="M40 88 L60 88 L53 26 L47 26 Z" fill="currentColor"/><line x1="50" y1="26" x2="50" y2="12"/><line x1="32" y1="20" x2="44" y2="30"/><line x1="68" y1="20" x2="56" y2="30"/>`)},
  {id:'schule', name:'Schule', cat:'gebaeude', svg: ico(`<path d="M18 82 L18 48 L50 26 L82 48 L82 82 Z"/><rect x="40" y="58" width="20" height="24" fill="currentColor"/>`)},
  {id:'post', name:'Post', cat:'gebaeude', svg: ico(`<path d="M22 78 Q20 24 78 32 Q58 44 50 62 Q68 56 80 68"/><circle cx="22" cy="78" r="6" fill="currentColor"/>`)},
  {id:'krankenhaus', name:'Krankenhaus', cat:'gebaeude', svg: `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="6" fill="currentColor"/><rect x="44" y="30" width="12" height="40" fill="var(--paper-cut,#f4eedb)"/><rect x="30" y="44" width="40" height="12" fill="var(--paper-cut,#f4eedb)"/></svg>`},
  {id:'schwimmbad', name:'Schwimmbad', cat:'gebaeude', svg: ico(`<rect x="18" y="28" width="64" height="44" rx="8"/><path d="M24 46 Q32 39 40 46 T56 46 T72 46" stroke-width="4"/><path d="M24 58 Q32 51 40 58 T56 58 T72 58" stroke-width="4"/>`)},
  {id:'hotel', name:'Hotel', cat:'gebaeude', svg: ico(`<rect x="20" y="44" width="52" height="38"/><line x1="64" y1="44" x2="64" y2="16"/><path d="M64 16 L86 25 L64 34 Z" fill="currentColor"/>`)},
  {id:'fluss', name:'Fluss', cat:'gewaesser', svg: ico(`<path d="M12 26 Q34 46 16 62 Q48 52 42 80 Q72 58 90 74" stroke-width="7"/>`)},
  {id:'bach', name:'Bach', cat:'gewaesser', svg: ico(`<path d="M10 50 Q28 30 50 50 T90 50" stroke-width="3.5"/>`)},

const STORE_KEY = 'ada_sach_v1';
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(!s) return defaultStore();
    const d = defaultStore();
    s.scores = Object.assign(d.scores, s.scores||{});
    return s;
  }
  catch(e){ return defaultStore(); }
}
function defaultStore(){
  return {scores:{himmel:{c:0,t:0}, zeichen:{c:0,t:0}, grid:{c:0,t:0}, bildarten:{c:0,t:0}, arten:{c:0,t:0}, massstab:{c:0,t:0}, missionen:{c:0,t:0}, probe:{c:0,t:0}}};
}
let STORE = loadStore();
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); }
function recordAnswer(cat, correct){
  STORE.scores[cat].t++;
  if(correct) STORE.scores[cat].c++;
  saveStore();
}
function pct(cat){
  const s = STORE.scores[cat];
  if(!s || s.t===0) return 0;
  return Math.round(100*s.c/s.t);
}

function compassSVG(highlight){
  const marks = DIRS.map(d=>{
    const on = highlight===d.id;
    const pos = {N:[100,20],O:[180,100],S:[100,180],W:[20,100]}[d.id];
    return `<text x="${pos[0]}" y="${pos[1]}" text-anchor="middle" dominant-baseline="middle"
      font-family="Lexend" font-weight="800" font-size="22"
      fill="${on?'#b5502e':'#2b2620'}">${d.id}</text>`;
  }).join('');
  const arrow = highlight ? (()=>{
    const rot = {N:0,O:90,S:180,W:270}[highlight];
    return `<g transform="rotate(${rot} 100 100)"><path d="M100 100 L100 40" stroke="#b5502e" stroke-width="6" stroke-linecap="round"/><path d="M100 40 L90 56 L110 56 Z" fill="#b5502e"/></g>`;
  })() : '';
  return `<svg class="compass" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="88" fill="#fffdf6" stroke="#2f5d43" stroke-width="4"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#cdbf94" stroke-width="2"/>
    <line x1="100" y1="12" x2="100" y2="188" stroke="#cdbf94" stroke-width="2"/>
    <line x1="12" y1="100" x2="188" y2="100" stroke="#cdbf94" stroke-width="2"/>
    ${arrow}
    ${marks}
    <circle cx="100" cy="100" r="5" fill="#2b2620"/>
  </svg>`;
}

function himmelQuiz(){
  const qs = [];
  const shuffledDirs = shuffle(DIRS);
  shuffledDirs.forEach(d=>{
    qs.push({
      type:'compass',
      prompt:`Welche Himmelsrichtung zeigt der Pfeil?`,
      target:d.id,
      correctName:d.name,
    });
  });
  shuffle(DIRS).forEach(d=>{
    qs.push({
      type:'pos',
      prompt:`Auf der Karte ist ${d.pos==='oben'?'oben':d.pos==='unten'?'unten':d.pos==='rechts'?'rechts':'links'} welche Himmelsrichtung?`,
      target:d.id,
      correctName:d.name,
    });
  });
  runQuiz('himmel', sample(qs,8), renderHimmelQ, '🧭 Himmelsrichtungen – Übung');
}
function renderHimmelQ(q, onAnswer){

      ${opts.map(d=>`<div class="opt" data-id="${d.id}" onclick="handleOpt(this,'${d.id}')">${d.name}</div>`).join('')}

}

  const pool = zeichenCatFilter==='all' ? SIGNS : SIGNS.filter(s=>s.cat===zeichenCatFilter);
  const chosen = sample(pool, Math.min(10, pool.length));
  const qs = chosen.map(s=>({sign:s, dir: Math.random()<0.5 ? 'icon2name' : 'name2icon'}));
  runQuiz('zeichen', qs, renderZeichenQ, '🗺️ Kartenzeichen – Übung');
}
function renderZeichenQ(q, onAnswer){
  const pool = SIGNS.filter(s=>s.cat===q.sign.cat && s.id!==q.sign.id);
  const distractors = sample(pool, Math.min(3, pool.length));
  let extra = SIGNS.filter(s=>s.id!==q.sign.id && !distractors.includes(s));
  while(distractors.length<3 && extra.length){ distractors.push(extra.pop()); }
  const opts = shuffle([q.sign, ...distractors]);
  if(q.dir==='icon2name'){
    return `
      <div class="flash-icon">${q.sign.svg}</div>
      <div class="qprompt">Wie heißt dieses Kartenzeichen?</div>
      <div class="options">
        ${opts.map(s=>`<div class="opt" data-id="${s.id}" onclick="handleOpt(this,'${s.id}')">${s.name}</div>`).join('')}
      </div>`;
  } else {
    return `
      <div class="qprompt">Welches Zeichen bedeutet <b>${q.sign.name}</b>?</div>
      <div class="options">
        ${opts.map(s=>`<div class="opt" data-id="${s.id}" onclick="handleOpt(this,'${s.id}')">${s.svg}</div>`).join('')}
      </div>`;
  }
}

function mapGridHTML(opts={}){

function buildExamQuestions(){
  const qs = [];
  // Kartenzeichen: 6
  sample(SIGNS,6).forEach(s=>qs.push({cat:'zeichen', render:renderZeichenQ, q:{sign:s, dir: Math.random()<0.5?'icon2name':'name2icon'}}));
  // Planquadrate: 5
  sample(QUERYABLE,5).forEach(it=>qs.push({cat:'grid', render:renderGridQ, q:{item:it, mode: Math.random()<0.5?'find':'whatis'}}));
  // Himmelsrichtungen: 3
  sample(DIRS,3).forEach(d=>qs.push({cat:'himmel', render:renderHimmelQ, q:{type: Math.random()<0.5?'compass':'pos', target:d.id, prompt:`Auf der Karte ist ${d.pos} welche Himmelsrichtung?`}}));
  // Bildarten: 2
  sample(BILDARTEN_Q,2).forEach(q=>qs.push({cat:'bildarten', render:renderGenericQ, q}));
  // Kartenarten: 2
  sample(KARTENARTEN_Q,2).forEach(q=>qs.push({cat:'arten', render:renderGenericQ, q}));
  // Maßstab: 2
  sample(MASSSTAB_Q,2).forEach(q=>qs.push({cat:'massstab', render:renderGenericQ, q}));

}

function revealAnswer(id){ document.getElementById('ans_'+id).style.display='block'; }
function markSelf(id, cat, correct){
  recordAnswer(cat, correct);
  const label = document.getElementById('marked_'+id);
  label.textContent = correct ? '✓ gemerkt' : 'wird nochmal geübt';
  label.style.color = correct ? 'var(--ok)' : 'var(--bad)';
  const qc = document.getElementById('qc_'+id);
  if(qc) qc.dataset.correct = correct ? '1' : '0';
}
function computePoints(){
  let total=0, max=0;
  document.querySelectorAll('.qcheck[data-points]').forEach(elx=>{
    const p = Number(elx.dataset.points)||0;
    max += p;
    if(elx.dataset.correct==='1') total += p;
  });
  return {total, max};
}
function miniMC(id, cat, num, q, opts, correctIdx){
  return `<div class="qcheck">
    <div class="qc-head"><span class="qc-num">${num}</span><span class="qc-text">${q}</span></div>
    <div class="options" id="mmopt_${id}">
      ${opts.map((o,i)=>`<div class="opt" onclick="answerMiniMC('${id}','${cat}',${i},${correctIdx}, this)">${o}</div>`).join('')}
    </div>
  </div>`;
}
function answerMiniMC(id, cat, chosen, correctIdx, elx){
  const box = document.getElementById('mmopt_'+id);
  const correct = chosen===correctIdx;
  box.querySelectorAll('.opt').forEach((o,i)=>{ o.classList.add('disabled'); if(i===correctIdx) o.classList.add('correct'); });
  if(!correct) elx.classList.add('wrong');
  recordAnswer(cat, correct);
}

function initDoodle(canvasId){
  const cv = document.getElementById(canvasId);
  if(!cv || cv._inited) return;
  cv._inited = true;
  const ctx = cv.getContext('2d');
  ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 3; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing = false, last=null;
  function pos(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const cx = (t ? t.clientX : e.clientX) - r.left;
    const cy = (t ? t.clientY : e.clientY) - r.top;
    return [cx * cv.width/r.width, cy * cv.height/r.height];
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  cv.addEventListener('mousedown', start);
  cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', end);
}
function clearDoodle(id){
  const cv = document.getElementById('cv_'+id);
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}
function toggleRef(id){
  const elx = document.getElementById('ref_'+id);
  elx.style.display = elx.style.display==='flex' ? 'none' : 'flex';
}
function initAllDoodles(){
  document.querySelectorAll('canvas.doodle-canvas').forEach(cv=>initDoodle(cv.id));
}

      <td style="text-align:center;"><button class="tri-btn" id="tri_${prefix}_${i}_ueben" onclick="setTri('${prefix}',${i},'ueben')"></button></td>
    </tr>`).join('')}
  </table>`;
}
function setTri(prefix, i, val){
  localStorage.setItem(`ada_tri_${prefix}_${i}`, val);
  setTriVisual(prefix, i, val);
}
function setTriVisual(prefix, i, val){
  ['sicher','fast','ueben'].forEach(v=>{
    const b = document.getElementById(`tri_${prefix}_${i}_${v}`);
    if(b) b.classList.toggle('sel-'+v, v===val);
  });
}
function restoreTri(prefix){
  TRI_ROWS.forEach((_,i)=>{
    const val = localStorage.getItem(`ada_tri_${prefix}_${i}`);
    if(val) setTriVisual(prefix, i, val);
  });
}

/* ---- generic reference grid (no terrain, always-visible labels) ---- */
function renderRefGrid(cols, rows, pois, opts={}){
  const cell = opts.cell || 44;
  let cellsHTML = '';
  for(const r of rows){ for(const c of cols){
    cellsHTML += `<div class="cell plain" style="grid-column:${cols.indexOf(c)+1}; grid-row:${r};"></div>`;
  }}
  const poisHTML = pois.map(p=>{
    const ci = cols.indexOf(p.col)+1, ri = p.row;
    const sign = SIGN_BY_ID[p.icon];
    return `<div class="poi" style="grid-column:${ci}; grid-row:${ri};">${sign.svg}<div class="poi-label">${p.name}</div></div>`;
  }).join('');
  const w = cols.length*cell, h = rows.length*cell;
  const linesHTML = opts.lines ? `<svg class="lines-overlay" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${opts.lines.map(l=>`<path d="${l.d}" fill="none" stroke="${l.color}" stroke-width="${l.width||4}" stroke-dasharray="${l.dash||''}" stroke-linecap="round"/>`).join('')}</svg>` : '';
  const compassHTML = opts.compass ? `<div class="mini-compass">N<br>↑</div>` : '';
  return `
  <div class="mapwrap">
    <div class="colheaders"><div style="width:26px;"></div>${cols.map(c=>`<div style="width:${cell}px;">${c}</div>`).join('')}</div>
    <div class="maprow">
      <div class="rowheaders">${rows.map(r=>`<div style="height:${cell}px;">${r}</div>`).join('')}</div>
      <div class="mapgrid" style="grid-template-columns:repeat(${cols.length},${cell}px); grid-template-rows:repeat(${rows.length},${cell}px); position:relative;">
        ${cellsHTML}${linesHTML}${poisHTML}${compassHTML}
      </div>
    </div>
  </div>`;
}

function finishProbe(){
  const t2 = computePoints();
  const t1 = PROBE_TEIL1_SCORE || {total:0,max:0};
  const total = t1.total+t2.total, max = t1.max+t2.max;
  const p = max ? Math.round(100*total/max) : 0;
  render(`
    ${topbar('Ergebnis')}
    <div class="card">
      <div class="result-big"><div class="num">${total} / ${max}</div><div class="sub">${p}% – Teil 1: ${t1.total}/${t1.max} · Teil 2: ${t2.total}/${t2.max}</div></div>
      <div style="text-align:center; margin:14px 0; font-size:1.4rem;">${p>=85?'🌟 Sehr sicher – das wird eine 1!':p>=65?'👍 Gut vorbereitet – Feinschliff reicht.':'💪 Die unsicheren Themen noch einmal in den Missionen üben.'}</div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn secondary" onclick="missionsHome()">Zu den Missionen</button>
        <button class="btn" onclick="screenMenu()">Zum Menü</button>
      </div>
    </div>
  `);
}
